<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>論文の系譜図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<style>

:root{
  --bg:#F1F2EE; --surface:#FBFBF8; --ink:#1D2328; --muted:#5C6569; --line:#C8CDC8; --faint:#E2E5E0;
  --accent:#1E3E9E;
  --l-project:#1D2328; --l-persist:#3E5BBF; --l-measure:#A2457A; --l-immerse:#2C8A86;
  --l-env:#A9761C; --l-decision:#B5473C; --l-cognition:#5D6C7A; --l-other:#868B86;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15191C; --surface:#1C2125; --ink:#E7EAE6; --muted:#9AA3A6; --line:#3A4246; --faint:#262C30;
  --accent:#8FA8FF;
  --l-project:#E7EAE6; --l-persist:#8DA2F2; --l-measure:#E08BB8; --l-immerse:#5CC4BE;
  --l-env:#E0B05A; --l-decision:#EE8A7F; --l-cognition:#A9B6C2; --l-other:#8E948F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15191C; --surface:#1C2125; --ink:#E7EAE6; --muted:#9AA3A6; --line:#3A4246; --faint:#262C30;
  --accent:#8FA8FF;
  --l-project:#E7EAE6; --l-persist:#8DA2F2; --l-measure:#E08BB8; --l-immerse:#5CC4BE;
  --l-env:#E0B05A; --l-decision:#EE8A7F; --l-cognition:#A9B6C2; --l-other:#8E948F; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.7}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.4vw,36px);line-height:1.2;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:70ch}
.stamp{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav.tabs button{font:inherit;font-weight:500;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
nav.tabs button:focus-visible,.chip:focus-visible,.tg:focus-visible,.gapcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px 3px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.tg{font:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);align-items:center}
.legend svg{vertical-align:middle}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.canvas{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:auto;min-width:0;max-height:78vh;touch-action:pan-x pan-y;overscroll-behavior:contain}
.graphcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.zoombar{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:12px;color:var(--muted)}
.zoombar button{font:inherit;font-size:13px;min-width:34px;height:30px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;cursor:pointer;padding:0 8px}
.zoombar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zoombar .zv{font-family:var(--f-mono);min-width:44px;text-align:center}
svg#g{display:block}
.lanebg{fill:var(--faint)}
.lanelabel{font-family:var(--f-body);font-size:12px;font-weight:700;fill:var(--muted);letter-spacing:.04em}
.tick{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.tickline{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.edge{fill:none;stroke-width:1.3;opacity:.55;transition:opacity .15s}
.edge.cites{stroke:var(--ink)}
.edge.concept{stroke:var(--muted);stroke-dasharray:5 4}
.edge.use{stroke:var(--accent);stroke-dasharray:1 3;stroke-width:1.6;opacity:.45}
.edgehit{fill:none;stroke:transparent;stroke-width:10;cursor:pointer}
.node{cursor:pointer}
.node rect{stroke-width:1.4}
.node text{font-family:var(--f-body);font-size:12px;fill:var(--ink);pointer-events:none}
.node .num{font-family:var(--f-mono);font-weight:500}
.node.read rect{fill:var(--surface);stroke:var(--c)}
.node.read .band{fill:var(--c)}
.node.reading rect{fill:var(--surface);stroke:var(--c);stroke-dasharray:4 3}
.node.root rect{fill:var(--bg);stroke:var(--line)}
.node.root text{font-family:var(--f-display);font-weight:600}
.node.shared rect,.node.bridge rect{fill:var(--surface);stroke:var(--muted);stroke-dasharray:2 3}
.node.shared text,.node.bridge text{fill:var(--muted)}
.node.project rect{fill:var(--ink);stroke:var(--ink)}
.node.project text{fill:var(--bg);font-weight:700}
.node:focus-visible rect{outline:none;stroke:var(--accent);stroke-width:2.5}
svg.dim .node{opacity:.18}
svg.dim .edge{opacity:.06}
svg.dim .node.hl{opacity:1}
svg.dim .edge.hl{opacity:.95;stroke-width:2.2}
.node.sel rect{stroke:var(--accent);stroke-width:2.6}
aside.side{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);max-height:calc(100vh - 16px);overflow:auto;overscroll-behavior:contain}
@media (max-width:900px){aside.side{position:static;max-height:none}}
.panel{padding:16px;display:flex;flex-direction:column;gap:12px}
.back{font:inherit;font-size:12.5px;align-self:flex-start;background:none;border:1px solid var(--line);border-radius:4px;padding:2px 10px;color:var(--muted);cursor:pointer}
.plist{display:flex;flex-direction:column}
.plist .head{position:sticky;top:0;background:var(--surface);padding:12px 14px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;z-index:1}
.plist .head b{font-family:var(--f-display);font-size:16px}
.plist input{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.plist h4{margin:0;padding:10px 14px 4px;font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.pitem{font:inherit;display:grid;grid-template-columns:10px 2.2em minmax(0,1fr) auto;gap:6px;align-items:baseline;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:6px 14px 6px 11px;cursor:pointer;color:var(--ink);font-size:13px;line-height:1.45}
.pitem:hover,.pitem.on{background:var(--faint);border-left-color:var(--c)}
.pitem:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pitem i{width:8px;height:8px;border-radius:50%;background:var(--c);align-self:center}
.pitem .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pitem .y{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ochiai{display:flex;flex-direction:column;gap:6px}
.ochiai details{border-top:1px solid var(--line);padding-top:6px}
.ochiai summary{cursor:pointer;font-weight:700;font-size:13px}
.ochiai details p{white-space:pre-line;font-size:13px;margin:6px 0 4px}
.srcnote{font-size:11.5px;color:var(--muted)}
.srcnote a{color:var(--accent)}
.node.pulse rect{animation:pulse 1.2s ease-out 2}
@keyframes pulse{0%{stroke-width:6}100%{stroke-width:1.4}}
.panel h2{font-family:var(--f-display);font-size:19px;line-height:1.35;margin:0;text-wrap:balance}
.panel .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.pill{border-radius:999px;padding:1px 9px;font-size:11.5px;border:1px solid var(--c,var(--line));color:var(--c,var(--muted))}
.panel p{margin:0}
.panel .note{color:var(--muted);font-size:12.5px;border-left:2px solid var(--line);padding-left:10px}
.panel h3{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:4px 0 0;font-weight:700}
.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.links li{font-size:13px;display:flex;flex-direction:column;gap:2px}
.links button{font:inherit;font-weight:700;background:none;border:0;padding:0;color:var(--ink);text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.links .ver{font-size:11.5px;color:var(--muted)}
.kind{font-size:11px;font-family:var(--f-mono);color:var(--muted)}
.empty{color:var(--muted);padding:24px;text-align:center}
.listview{display:flex;flex-direction:column;gap:24px}
.lanegroup h2{font-family:var(--f-display);font-size:20px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.lanegroup h2 i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;font-size:15px;line-height:1.45}
.card .about{margin:0;font-size:13px}
.card ul{margin:0;padding-left:1.1em;font-size:13px;display:flex;flex-direction:column;gap:4px}
.gaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:12px}
.gapcard{font:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.gapcard:hover{border-color:var(--accent)}
.gapcard h3{margin:0;font-family:var(--f-display);font-size:17px;line-height:1.4}
.gapcard p{margin:0;font-size:13.5px}
.gapcard .go{font-size:12px;color:var(--accent);font-weight:700}
.intro{font-size:13px;color:var(--muted);max-width:80ch;margin:0}
footer{font-size:12px;color:var(--muted);max-width:90ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>論文の系譜図</h1>
      <p class="sub">読んだ論文を、引用のつながりでたどる。左ほど古く、右ほど新しい。いちばん右上が自分の研究。</p>
    </div>
    <div class="stamp" id="stamp">データを読み込んでいます…</div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="t-graph" aria-selected="true" data-tab="graph">系譜図</button>
    <button role="tab" id="t-list" aria-selected="false" data-tab="list">つながりを読む</button>
    <button role="tab" id="t-gaps" aria-selected="false" data-tab="gaps">攻めどころ</button>
  </nav>

  <section id="v-graph" style="display:flex;flex-direction:column;gap:12px">
    <div class="controls">
      <div class="chips" id="chips"></div>
      <label class="tg"><input type="checkbox" id="showConcept" checked> 推測の線</label>
      <label class="tg"><input type="checkbox" id="showUse" checked> 本研究での使い方</label>
    </div>
    <div class="legend">
      <span><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="currentColor" stroke-width="1.4"/></svg> 引用を確認</span>
      <span><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4"/></svg> 推測（※引用は未確認）</span>
      <span><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="var(--accent)" stroke-width="1.8" stroke-dasharray="1 3"/></svg> 本研究での使い方</span>
      <span>枠：実線＝読んだ　破線＝読解中　灰色の点線＝未読（2本以上が引用）　明朝体＝古典・理論の根っこ</span>
    </div>
    <div class="main">
      <div class="graphcol">
        <div class="zoombar">
          <span>2本指でピンチ／Ctrl＋ホイールでも拡大縮小</span>
          <button id="zOut" aria-label="縮小">−</button>
          <span class="zv" id="zVal">100%</span>
          <button id="zIn" aria-label="拡大">＋</button>
          <button id="zFit">全体</button>
          <button id="z100">100%</button>
        </div>
        <div class="canvas" id="canvas"><div class="empty" id="graphEmpty">データを読み込んでいます…</div><svg id="g" role="img" aria-label="論文の系譜図"></svg></div>
      </div>
      <aside class="side" id="side">
        <div class="panel" id="panel" aria-live="polite" hidden></div>
        <div class="plist" id="plist">
          <div class="head"><b>論文リスト</b><input id="q" type="search" placeholder="番号・著者・キーワードで探す" aria-label="論文を探す"><span class="srcnote">押すと系譜図の中でその論文の位置へ移動します。</span></div>
          <div id="plistBody"></div>
        </div>
      </aside>
    </div>
  </section>

  <section id="v-list" hidden>
    <div class="listview" id="listview"></div>
  </section>

  <section id="v-gaps" hidden>
    <p class="intro" style="margin-bottom:12px">※ここに書いたことは、読んだ論文と確認できた参考文献の範囲で見えた「つながりの空白」です（Claudeの読み）。クリックすると系譜図で該当する論文を強調します。</p>
    <div class="gaps" id="gaps"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const LANES=[
 {id:"project",label:"本研究"},
 {id:"persist",label:"余韻・気分の持続"},
 {id:"measure",label:"感情の測定"},
 {id:"immerse",label:"没入・物語"},
 {id:"env",label:"環境・音楽・購買"},
 {id:"decision",label:"感情と意思決定"},
 {id:"cognition",label:"認知・情報処理"},
 {id:"other",label:"その他（HSI）"}
];
const KIND={read:"読んだ論文",reading:"読解中",root:"古典・理論の根っこ",shared:"未読（2本以上が共通して引用）",bridge:"未読（読んだ論文どうしの橋渡し）",project:"自分の研究"};
const ETYPE={cites:"引用を確認",concept:"推測（※引用は未確認）",use:"本研究での使い方"};
const laneColor=id=>`var(--l-${id})`;
const state={nodes:[],edges:[],gaps:[],meta:null,axis:null,sel:null,selEdge:null,hl:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- tabs ---------- */
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));
function showTab(t){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  for(const v of ["graph","list","gaps"]) $("#v-"+v).hidden = v!==t;
  try{localStorage.setItem("lineage-tab",t)}catch(e){}
}
try{const t=localStorage.getItem("lineage-tab"); if(t) showTab(t)}catch(e){}

/* ---------- chips ---------- */
function renderChips(){
  const used=new Set(state.nodes.map(n=>n.lane));
  $("#chips").innerHTML = LANES.filter(l=>l.id!=="project"&&used.has(l.id)).map(l=>
    `<button class="chip" style="--c:${laneColor(l.id)}" aria-pressed="${state.axis===l.id}" data-axis="${l.id}"><i></i>${esc(l.label)}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
    state.axis = state.axis===c.dataset.axis?null:c.dataset.axis; state.hl=null; renderChips(); applyHighlight();
  }));
}
$("#showConcept").addEventListener("change",drawGraph);
$("#showUse").addEventListener("change",drawGraph);

/* ---------- graph ---------- */
const STOPS=[[1865,0],[1950,.12],[1960,.17],[1980,.36],[2000,.60],[2010,.75],[2027,1]];
function xScale(y,W){for(let i=1;i<STOPS.length;i++){const [y0,p0]=STOPS[i-1],[y1,p1]=STOPS[i];if(y<=y1){return (p0+(p1-p0)*(y-y0)/(y1-y0))*W}}return W}
const ctx=document.createElement("canvas").getContext("2d");
function textW(t,root){ctx.font=(root?"600 12px 'Shippori Mincho B1',serif":"12px 'IBM Plex Sans JP',sans-serif");return ctx.measureText(t).width}

function drawGraph(){
  const svg=$("#g");
  if(!state.nodes.length){svg.innerHTML="";$("#graphEmpty").hidden=false;return}
  $("#graphEmpty").hidden=true;
  const LABELW=118, W=1320, PADR=24, ROWH=34, LANEPAD=12, TOP=30;
  const pos={};
  let y=TOP; const laneBoxes=[];
  for(const lane of LANES){
    const ns=state.nodes.filter(n=>n.lane===lane.id);
    if(!ns.length) continue;
    const items=ns.map(n=>{
      const label=(n.num?n.num+" ":"")+n.label;
      const w=Math.min(300,textW(label,n.kind==="root")+22+(n.kind==="read"?6:0));
      let cx=LABELW+xScale(n.year,W-LABELW-PADR);
      let left=Math.max(LABELW,Math.min(cx-w/2,W-PADR-w));
      return {n,label,w,left};
    }).sort((a,b)=>a.left-b.left);
    const rows=[];
    for(const it of items){
      let r=rows.findIndex(end=>end+10<=it.left);
      if(r<0){rows.push(0);r=rows.length-1}
      rows[r]=it.left+it.w; it.row=r;
    }
    const h=rows.length*ROWH+LANEPAD*2;
    for(const it of items){pos[it.n.id]={x:it.left,y:y+LANEPAD+it.row*ROWH+3,w:it.w,h:ROWH-10,label:it.label,n:it.n}}
    laneBoxes.push({lane,y,h}); y+=h+6;
  }
  const H=y+8;
  base.W=W; base.H=H;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); sizeSvg();
  let out=`<defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--ink)" opacity=".7"/></marker>
    <marker id="arc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
  </defs>`;
  for(const lb of laneBoxes){
    out+=`<rect class="lanebg" x="0" y="${lb.y}" width="${W}" height="${lb.h}" opacity="${laneBoxes.indexOf(lb)%2?0.55:0}"/>`;
    out+=`<rect x="10" y="${lb.y+lb.h/2-5}" width="10" height="10" rx="5" fill="${laneColor(lb.lane.id)}"/>`;
    out+=`<text class="lanelabel" x="26" y="${lb.y+lb.h/2+4}">${esc(lb.lane.label)}</text>`;
  }
  for(const yr of [1880,1920,1950,1970,1980,1990,2000,2010,2020]){
    const x=LABELW+xScale(yr,W-LABELW-PADR);
    out+=`<line class="tickline" x1="${x}" y1="${TOP-6}" x2="${x}" y2="${H}"/><text class="tick" x="${x}" y="${TOP-12}" text-anchor="middle">${yr}</text>`;
  }
  const showC=$("#showConcept").checked, showU=$("#showUse").checked;
  for(const e of state.edges){
    if(e.type==="concept"&&!showC) continue;
    if(e.type==="use"&&!showU) continue;
    const a=pos[e.frm], b=pos[e.to]; if(!a||!b) continue;
    let x1,y1=a.y+a.h/2,x2,y2=b.y+b.h/2;
    if(b.x+b.w<=a.x){x1=a.x;x2=b.x+b.w}else if(a.x+a.w<=b.x){x1=a.x+a.w;x2=b.x}else{x1=a.x+a.w/2;x2=b.x+b.w/2;y1=a.y+(y2>y1?a.h:0);y2=b.y+(y2>y1?0:b.h)}
    const dx=Math.max(40,Math.abs(x2-x1)*0.45)*(x2<x1?-1:1);
    const d=(Math.abs(x2-x1)<4)?`M${x1},${y1} C${x1+40},${y1} ${x2+40},${y2} ${x2},${y2}`:`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;
    const mk=e.type==="cites"?'marker-end="url(#ar)"':e.type==="concept"?'marker-end="url(#arc)"':"";
    out+=`<path class="edge ${e.type}" data-e="${esc(e.id)}" d="${d}" ${mk}/><path class="edgehit" data-e="${esc(e.id)}" d="${d}"><title>${esc(ETYPE[e.type])}</title></path>`;
  }
  for(const id in pos){
    const p=pos[id], n=p.n, c=laneColor(n.lane);
    out+=`<g class="node ${n.kind}" data-n="${esc(id)}" tabindex="0" role="button" aria-label="${esc(p.label)}" style="--c:${c}">
      <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${n.kind==="root"?2:5}"/>
      ${n.kind==="read"?`<rect class="band" x="${p.x}" y="${p.y}" width="5" height="${p.h}" rx="2"/>`:""}
      <text x="${p.x+(n.kind==="read"?13:10)}" y="${p.y+p.h/2+4}">${n.num?`<tspan class="num">${esc(n.num)}</tspan> `:""}${esc(n.num?p.label.slice(n.num.length+1):p.label)}</text>
      <title>${esc(p.label)}（${n.year}）</title></g>`;
  }
  svg.innerHTML=out; posCache=pos;
  svg.querySelectorAll(".node").forEach(g=>{
    g.addEventListener("click",()=>selectNode(g.dataset.n));
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selectNode(g.dataset.n)}});
  });
  svg.querySelectorAll(".edgehit").forEach(p=>p.addEventListener("click",()=>selectEdge(p.dataset.e)));
  applyHighlight();
}

let posCache={};
function centerOn(id){
  const p=posCache[id], c=$("#canvas"); if(!p) return;
  c.scrollTo({left:(p.x+p.w/2)*zoom-c.clientWidth/2, top:(p.y+p.h/2)*zoom-c.clientHeight/2, behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  const g=$("#g").querySelector(`.node[data-n="${CSS.escape(id)}"]`);
  if(g){g.classList.remove("pulse"); void g.getBoundingClientRect(); g.classList.add("pulse")}
  const r=c.getBoundingClientRect(); if(r.top<0||r.bottom>innerHeight) c.scrollIntoView({block:"nearest"});
}

/* ---------- paper list ---------- */
const LISTGROUPS=[
  {t:"自分の研究",k:["project"]},
  {t:"読んだ論文",k:["read"]},
  {t:"読解中",k:["reading"]},
  {t:"未読（共通して引用・橋渡し）",k:["shared","bridge"]},
  {t:"古典・理論の根っこ",k:["root"]}
];
const numKey=n=>{const m="①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳".indexOf(n.num||"");return m<0?999:m};
function renderPaperList(){
  const q=($("#q").value||"").trim().toLowerCase();
  const hit=n=>!q||[n.num,n.label,n.about,String(n.year),n.survey?.what].join(" ").toLowerCase().includes(q);
  let html="";
  for(const g of LISTGROUPS){
    const ns=state.nodes.filter(n=>g.k.includes(n.kind)&&hit(n)).sort((a,b)=>g.k.includes("read")?numKey(a)-numKey(b):a.year-b.year);
    if(!ns.length) continue;
    html+=`<h4>${esc(g.t)}（${ns.length}）</h4>`+ns.map(n=>`<button class="pitem${state.sel===n.id?" on":""}" style="--c:${laneColor(n.lane)}" data-p="${esc(n.id)}"><i></i><span class="n">${esc(n.num||"")}</span><span>${esc(n.label)}</span><span class="y">${n.year}</span></button>`).join("");
  }
  $("#plistBody").innerHTML = html || `<p class="empty">${state.nodes.length?"見つかりませんでした。":"まだ論文が登録されていません。"}</p>`;
  $("#plistBody").querySelectorAll(".pitem").forEach(b=>b.addEventListener("click",()=>{showTab("graph"); selectNode(b.dataset.p,true); centerOn(b.dataset.p)}));
}
$("#q").addEventListener("input",renderPaperList);

/* ---------- zoom (pinch / ctrl+wheel / buttons) ---------- */
const base={W:0,H:0}; let zoom=1; const ZMIN=0.3, ZMAX=3;
function sizeSvg(){const s=$("#g"); if(!base.W) return; s.setAttribute("width",Math.round(base.W*zoom)); s.setAttribute("height",Math.round(base.H*zoom)); $("#zVal").textContent=Math.round(zoom*100)+"%"}
function setZoom(z,fx,fy){
  const c=$("#canvas"); z=Math.max(ZMIN,Math.min(ZMAX,z)); if(!base.W||Math.abs(z-zoom)<1e-4) return;
  if(fx==null){fx=c.clientWidth/2; fy=c.clientHeight/2}
  const cx=(c.scrollLeft+fx)/zoom, cy=(c.scrollTop+fy)/zoom;
  zoom=z; sizeSvg();
  c.scrollLeft=cx*zoom-fx; c.scrollTop=cy*zoom-fy;
}
$("#zIn").addEventListener("click",()=>setZoom(zoom*1.25));
$("#zOut").addEventListener("click",()=>setZoom(zoom/1.25));
$("#z100").addEventListener("click",()=>setZoom(1));
$("#zFit").addEventListener("click",()=>{const c=$("#canvas"); if(base.W) setZoom(Math.min((c.clientWidth-4)/base.W,1),0,0)});
(()=>{
  const c=$("#canvas"); const pts=new Map(); let pinch=null;
  const rel=e=>{const r=c.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
  c.addEventListener("pointerdown",e=>{if(e.pointerType!=="touch")return; pts.set(e.pointerId,rel(e));
    if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:zoom}}});
  c.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return; pts.set(e.pointerId,rel(e));
    if(pinch&&pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y)||1;setZoom(pinch.z*d/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2)}});
  const end=e=>{pts.delete(e.pointerId); if(pts.size<2) pinch=null};
  ["pointerup","pointercancel","pointerleave"].forEach(t=>c.addEventListener(t,end));
  c.addEventListener("wheel",e=>{if(!e.ctrlKey&&!e.metaKey)return; e.preventDefault(); const p=rel(e); setZoom(zoom*Math.exp(-e.deltaY*0.0025),p.x,p.y)},{passive:false});
  // Safari (iOS/macOS) gesture events
  let gz=1; c.addEventListener("gesturestart",e=>{e.preventDefault();gz=zoom});
  c.addEventListener("gesturechange",e=>{e.preventDefault();const p=rel(e);setZoom(gz*e.scale,p.x,p.y)});
})();

function applyHighlight(){
  const svg=$("#g"); if(!svg.firstChild) return;
  let nodes=null, edges=null;
  if(state.sel){
    nodes=new Set([state.sel]); edges=new Set();
    for(const e of state.edges) if(e.frm===state.sel||e.to===state.sel){edges.add(e.id);nodes.add(e.frm);nodes.add(e.to)}
  }else if(state.selEdge){
    const e=state.edges.find(x=>x.id===state.selEdge); if(e){nodes=new Set([e.frm,e.to]);edges=new Set([e.id])}
  }else if(state.hl){
    nodes=new Set(state.hl); edges=new Set(state.edges.filter(e=>nodes.has(e.frm)&&nodes.has(e.to)).map(e=>e.id));
  }else if(state.axis){
    nodes=new Set(state.nodes.filter(n=>(n.axes||[]).includes(state.axis)||n.lane===state.axis).map(n=>n.id));
    edges=new Set(state.edges.filter(e=>nodes.has(e.frm)&&nodes.has(e.to)).map(e=>e.id));
  }
  svg.classList.toggle("dim",!!nodes);
  svg.querySelectorAll(".node").forEach(g=>{g.classList.toggle("hl",!!nodes&&nodes.has(g.dataset.n));g.classList.toggle("sel",g.dataset.n===state.sel)});
  svg.querySelectorAll(".edge").forEach(p=>p.classList.toggle("hl",!!edges&&edges.has(p.dataset.e)));
}

const byId=id=>state.nodes.find(n=>n.id===id);
const nm=n=>n?(n.num?n.num+" ":"")+n.label:"（不明）";
const OCHIAI=[["what","どんなもの？"],["novel","先行研究と比べて何がすごい？"],["key","技術や手法のキモは？"],["verify","どうやって有効だと検証した？"],["discuss","議論はある？"],["next","次に読むべき論文は？"],["wdi","WDI視点"],["why","読んだ理由"]];
function ochiaiHtml(n){
  const s=n.survey; if(!s) return "";
  const rows=OCHIAI.filter(([k])=>s[k]).map(([k,t],i)=>`<details${i===0?" open":""}><summary>${t}</summary><p>${esc(s[k])}</p></details>`).join("");
  const link=s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">Notionの論文サーベイで開く</a>`:"";
  return `<h3>論文サーベイ（落合フォーマット）</h3>
    ${rows?`<div class="ochiai">${rows}</div>`:`<p class="srcnote">まだ記入されていません（ステータス：${esc(s.status||"—")}）。</p>`}
    <p class="srcnote">Notionの論文サーベイから写した内容です（${esc(s.synced||"")}時点・記録日 ${esc(s.date||"—")}）。最新は ${link||"Notion"} で確認してください。</p>`;
}
function showPanel(html){
  $("#plist").hidden=true; const p=$("#panel"); p.hidden=false;
  p.innerHTML=`<button class="back" id="backBtn">← 論文リストに戻る</button>`+html;
  $("#backBtn").addEventListener("click",()=>{state.sel=null;state.selEdge=null;state.hl=null;applyHighlight();resetPanel()});
  $("#side").scrollTop=0;
}
function selectNode(id,force){
  state.sel = (!force&&state.sel===id)?null:id; state.selEdge=null; state.hl=null; applyHighlight();
  const n=byId(id); if(!state.sel||!n){resetPanel();return}
  const out=state.edges.filter(e=>e.frm===id), inn=state.edges.filter(e=>e.to===id);
  const li=(e,other)=>`<li><button data-goto="${esc(other.id)}">${esc(nm(other))}</button><span>${esc(e.text)}</span><span class="ver">${esc(ETYPE[e.type])}｜${esc(e.ver||"")}</span></li>`;
  const sec=(title,list,pick)=>list.length?`<h3>${title}（${list.length}）</h3><ul class="links">${list.map(e=>li(e,byId(pick(e)))).join("")}</ul>`:"";
  const outC=out.filter(e=>e.type!=="use"), inC=inn.filter(e=>e.type!=="use"), use=[...out,...inn].filter(e=>e.type==="use");
  showPanel(`
    <div class="meta"><span class="pill" style="--c:${laneColor(n.lane)}">${esc(LANES.find(l=>l.id===n.lane)?.label)}</span><span class="pill">${esc(KIND[n.kind]||n.kind)}</span><span class="kind">${n.year}</span></div>
    <h2>${esc(nm(n))}</h2>
    ${n.survey?.what?"":`<p>${esc(n.about)}</p>`}
    ${ochiaiHtml(n)}
    ${n.note?`<h3>系譜図でのメモ</h3><p class="note">${esc(n.note)}</p>`:""}
    ${sec(n.kind==="project"?"使っている論文":"この論文がたどる根っこ（引用している側）",outC.length?outC:(n.kind==="project"?use:[]),e=>e.to)}
    ${sec("この論文を受け継いでいるもの（引用されている側）",inC,e=>e.frm)}
    ${n.kind!=="project"&&use.length?`<h3>本研究での使い方</h3><ul class="links">${use.map(e=>`<li><span>${esc(e.text)}</span></li>`).join("")}</ul>`:""}`);
  bindGoto();
}
function selectEdge(id){
  state.selEdge=id; state.sel=null; state.hl=null; applyHighlight();
  const e=state.edges.find(x=>x.id===id); if(!e) return;
  const a=byId(e.frm), b=byId(e.to);
  showPanel(`
    <div class="meta"><span class="pill">${esc(ETYPE[e.type])}</span></div>
    <h2>${esc(nm(a))} → ${esc(nm(b))}</h2>
    <p>${esc(e.text)}</p>
    <p class="note">確認の方法：${esc(e.ver||"—")}</p>
    <ul class="links"><li><button data-goto="${esc(a.id)}">${esc(nm(a))} を見る</button></li><li><button data-goto="${esc(b.id)}">${esc(nm(b))} を見る</button></li></ul>`);
  bindGoto();
}
function bindGoto(){$("#panel").querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>{selectNode(b.dataset.goto,true);centerOn(b.dataset.goto)}))}
function resetPanel(){$("#panel").hidden=true;$("#plist").hidden=false;renderPaperList()}

/* ---------- list view ---------- */
function renderList(){
  const groups=LANES.map(l=>({l,ns:state.nodes.filter(n=>n.lane===l.id&&["read","reading","project"].includes(n.kind)).sort((a,b)=>a.year-b.year)})).filter(g=>g.ns.length);
  $("#listview").innerHTML = groups.length? groups.map(({l,ns})=>`
    <div class="lanegroup" style="--c:${laneColor(l.id)}"><h2><i></i>${esc(l.label)}</h2>
    <div class="cards">${ns.map(n=>{
      const out=state.edges.filter(e=>e.frm===n.id&&e.type!=="use"), inn=state.edges.filter(e=>e.to===n.id&&e.type!=="use");
      const use=state.edges.filter(e=>e.type==="use"&&(e.to===n.id));
      const item=(e,o)=>`<li><b>${esc(nm(o))}</b>：${esc(e.text)} <span class="kind">［${esc(ETYPE[e.type])}］</span></li>`;
      return `<article class="card"><span class="kind">${n.year}｜${esc(KIND[n.kind])}</span><h3>${esc(nm(n))}</h3><p class="about">${esc(n.survey?.what||n.about)}</p>${n.survey?.url?`<p class="srcnote"><a href="${esc(n.survey.url)}" target="_blank" rel="noopener">Notionの論文サーベイで開く</a></p>`:""}
        ${out.length?`<div class="kind">根っこ・引用しているもの</div><ul>${out.map(e=>item(e,byId(e.to))).join("")}</ul>`:""}
        ${inn.length?`<div class="kind">受け継いでいるもの</div><ul>${inn.map(e=>item(e,byId(e.frm))).join("")}</ul>`:""}
        ${use.length?`<div class="kind">本研究での使い方</div><ul>${use.map(e=>`<li>${esc(e.text)}</li>`).join("")}</ul>`:""}
        ${n.note?`<p class="about" style="color:var(--muted)">${esc(n.note)}</p>`:""}</article>`}).join("")}</div></div>`).join("")
    : `<p class="empty">まだ論文が登録されていません。</p>`;
}

/* ---------- gaps ---------- */
function renderGaps(){
  const gs=[...state.gaps].sort((a,b)=>(a.order||0)-(b.order||0));
  $("#gaps").innerHTML = gs.length? gs.map(g=>`<button class="gapcard" data-g="${esc(g.id)}"><h3>${esc(g.title)}</h3><p>${esc(g.text)}</p><span class="go">系譜図で見る →</span></button>`).join("") : `<p class="empty">まだ登録されていません。</p>`;
  $("#gaps").querySelectorAll(".gapcard").forEach(b=>b.addEventListener("click",()=>{
    const g=state.gaps.find(x=>x.id===b.dataset.g); state.hl=g?.nodes||null; state.sel=null; state.selEdge=null; state.axis=null;
    renderChips(); showTab("graph"); applyHighlight();
    showPanel(`<div class="meta"><span class="pill">攻めどころ（※Claudeの読み）</span></div><h2>${esc(g.title)}</h2><p>${esc(g.text)}</p><ul class="links">${(g.nodes||[]).map(id=>`<li><button data-goto="${esc(id)}">${esc(nm(byId(id)))}</button></li>`).join("")}</ul>`);
    bindGoto();
  }));
}

function renderAll(){
  renderChips(); drawGraph(); renderList(); renderGaps(); if(!$("#plist").hidden) renderPaperList();
  const m=state.meta;
  $("#stamp").textContent = state.nodes.length ? `論文・文献 ${state.nodes.length}件／線 ${state.edges.length}本${m?.updated?"｜更新 "+m.updated:""}` : "まだデータがありません";
  $("#foot").textContent = m?.note || "";
}

/* ---------- data ---------- */
(async()=>{
  try{
    const r=await fetch("data.json",{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    state.nodes=d.nodes||[]; state.edges=(d.edges||[]); state.gaps=d.gaps||[]; state.meta=d.meta||null;
    renderAll();
  }catch(e){
    $("#stamp").textContent="データを読み込めませんでした";
    $("#graphEmpty").textContent="data.json を読み込めませんでした。index.html と同じ場所に data.json があるか確認してください（パソコンでファイルを直接開いた場合は表示されません。GitHub Pages のURLから開いてください）。";
  }
})();
</script>
